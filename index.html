<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>007 Production — ระบบสั่งผลิต</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700;800&family=Prompt:wght@700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ═══ v9.0 โฉมใหม่: ฝั่งขาย/วางแผน = Clean Modern (สว่างนุ่ม) · บอร์ดเครื่อง = Mission Control (มืดเรืองแสง)
   สลับธีมด้วย class บน body (render() จัดการ) — HTML โครงเดิมทั้งหมด เทสต์เดิมต้องผ่านครบ ═══ */
:root{--bg:#f2f2ee;--panel:#fff;--ink:#151b28;--muted:#68738a;--line:#e6e6e0;
--accent:#1a56db;--red:#d92d20;--amber:#b54708;--green:#067647;--purple:#7c6bd6;--teal:#0aa5a0;}
body.dk{--bg:#0b1120;--panel:#101a33;--ink:#e6eaf5;--muted:#8291b4;--line:#22305a;--accent:#3b82f6;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Anuphan','Segoe UI',system-ui,'Leelawadee UI','Noto Sans Thai',sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:9px 14px 0;flex:0 0 auto;box-shadow:0 1px 2px rgba(16,24,40,.03)}
.h1r{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
h1{font-family:'Prompt',sans-serif;font-size:16px;margin:0;font-weight:800;letter-spacing:.2px}
.conn{font-size:10.5px;border-radius:99px;padding:2px 9px;font-weight:700;font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:.5px}
.conn.live{background:#e2f5e9;color:var(--green)}
.conn.off{background:#fee4e2;color:var(--red)}
body.busy button{pointer-events:none;opacity:.55}
.tline{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.7}
.tline b{color:#3c4657;font-weight:700}
.tline .dur{background:#e6f7f6;color:#0a8a85;border-radius:99px;padding:1px 7px;font-weight:700;white-space:nowrap}
.syncs{display:flex;gap:7px;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
.syncs .bad{color:var(--red);font-weight:700}
.userchip{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:#e9f0ff;color:var(--accent);border-radius:99px;padding:4px 11px}
.userchip button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0}
.h2r{display:flex;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap;padding-bottom:9px}
.tabs,.vtabs{display:flex;gap:5px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 13px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--muted);transition:.15s}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.vtab{border:none;background:#ecece7;border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap;transition:.15s}
.vtab.on{background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(26,86,219,.28)}
.vtab .b{background:var(--red);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;margin-left:3px}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px}
main.boardmode{overflow-x:auto;overflow-y:hidden;display:flex;gap:10px;scroll-snap-type:x proximity}
.page{max-width:840px;margin:0 auto}
.hint{font-size:12px;color:var(--muted);background:#eef3ff;border:1px solid #dbe6ff;border-radius:12px;padding:9px 13px;line-height:1.55;margin-bottom:11px}
.socard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:10px;box-shadow:0 1px 2px rgba(16,24,40,.05);transition:transform .16s,box-shadow .16s}
.socard:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(16,24,40,.09)}
.socard.dim{opacity:.6}
.so-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.so-h .so{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:14px;letter-spacing:-.2px}
.so-h .cu{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:110px}
.bdg{font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 8px;white-space:nowrap}
.bdg.late{background:#fee4e2;color:var(--red)}
.bdg.today{background:#fff4e5;color:var(--amber)}
.bdg.due{background:#eef1f5;color:var(--muted)}
.bdg.paid{background:#e2f5e9;color:var(--green)}
.bdg.inter{background:#efe9ff;color:var(--purple)}
.bdg.urgent{background:#fff4e5;color:var(--amber)}
.oi{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.oi input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}
.oi .d{flex:1;line-height:1.35;min-width:0}
.oi .q{white-space:nowrap;font-weight:700;font-size:12px}
.oi.stock{color:var(--muted)}
.oi.noprod{background:#fff5f4;border-radius:8px;padding:6px 8px}
.mchip{font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;background:#e9f0ff;color:var(--accent);white-space:nowrap;flex:0 0 auto}
.mchip.bad{background:#fee4e2;color:var(--red)}
.stag{font-size:10px;background:#eef1f5;border-radius:5px;padding:1px 6px;flex:0 0 auto;color:var(--muted)}
.dtag{font-size:10px;background:#e2f5e9;color:var(--green);border-radius:5px;padding:1px 6px;font-weight:700;flex:0 0 auto}
.warn{font-size:11px;color:var(--red);font-weight:700;margin-top:2px}
.so-foot{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.btn{border:none;border-radius:11px;padding:10px 15px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;transition:transform .1s,box-shadow .15s}
.btn:active{transform:translateY(1px)}
.btn.blue{background:var(--accent);color:#fff;box-shadow:0 2px 10px rgba(26,86,219,.25)}
.btn.dark{background:var(--ink);color:#fff}
.btn.green{background:var(--green);color:#fff;box-shadow:0 2px 10px rgba(6,118,71,.2)}
.btn.grey{background:#ecece7;color:var(--ink)}
.btn.amber{background:#fff4e5;color:var(--amber);border:1px solid #f5d9b0}
.btn.red{background:#fee4e2;color:var(--red)}
.btn:disabled{opacity:.35;cursor:default}
.okpill{margin-left:auto;font-size:12px;font-weight:800;color:var(--green)}
.tkt{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:9px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.tk-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tk-h .so{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:13px;letter-spacing:-.2px}
.cchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:#f4f5f2;border:1px solid var(--line);border-radius:7px;padding:2px 7px;font-weight:700;max-width:100%}
.cchip i{width:10px;height:10px;border-radius:3px;border:1px solid rgba(0,0,0,.12);flex:0 0 auto}
.met{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-top:5px;flex-wrap:wrap}
.met b{color:var(--ink)}
.who{font-size:10.5px;color:var(--muted);margin-top:4px}
.who b{color:var(--accent)}
.planrow{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.planx{margin-top:8px;background:#f7f8f5;border:1px dashed var(--line);border-radius:12px;padding:9px 11px;display:none}
.planx.show{display:block}
.planx select{border:1px solid var(--line);border-radius:9px;padding:8px;font-size:13px;font-family:inherit;margin-right:6px;background:#fff}
.coil{font-size:11px;margin-top:4px;font-weight:700}
.coil.ok{color:var(--green)}.coil.low{color:var(--red)}.coil.na{color:var(--muted);font-weight:400}
.col{flex:0 0 280px;max-width:87vw;display:flex;flex-direction:column;background:#e9ebe6;border-radius:14px;scroll-snap-align:start;min-height:0}
.col.down{background:#fbeceb}
.col-h{padding:9px 12px;display:flex;align-items:center;gap:7px;border-top:4px solid var(--cc,#8a94a6);border-radius:14px 14px 0 0}
.col-h .t{font-size:13px;font-weight:800}
.col-h .cnt{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--panel);border-radius:99px;padding:2px 8px;color:var(--muted);font-family:'JetBrains Mono',ui-monospace,monospace}
.col-h .dn{font-size:10px;color:var(--red);font-weight:800}
.col-h .mfix{border:none;background:none;cursor:pointer;font-size:13px;padding:0 2px}
.cards{flex:1;overflow-y:auto;padding:0 8px 10px;display:flex;flex-direction:column;gap:8px}
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.strip{height:5px;border-radius:99px;margin:-2px 0 7px;background:#e2e4de;overflow:hidden}
.strip i{display:block;height:100%;border-radius:99px}
.bc-foot{display:flex;gap:6px;margin-top:7px;align-items:center}
.bc-foot .btn{padding:8px 12px;font-size:12px;margin-left:auto}
.empty{font-size:11.5px;color:var(--muted);text-align:center;padding:16px 0}
.ovbg{position:fixed;inset:0;background:rgba(11,17,32,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ovbg.show{display:flex}
.sheet{background:var(--panel);width:min(540px,100%);max-height:86vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(11,17,32,.25)}
@media(min-width:700px){.ovbg{align-items:center}.sheet{border-radius:18px}}
.s-h{padding:13px 16px 9px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.s-x{margin-left:auto;border:none;background:#eef1f5;border-radius:99px;width:32px;height:32px;font-size:15px;cursor:pointer}
.s-b{overflow-y:auto;padding:12px 16px 16px;font-size:13px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}
.fields label{font-size:11px;color:var(--muted);font-weight:700;display:block;margin-bottom:3px}
.fields input{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;font-size:13px;font-family:inherit;outline:none}
.hist{font-size:11.5px;color:var(--muted);line-height:1.75;margin-top:10px}
.sec{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 5px}
table.items{width:100%;border-collapse:collapse;font-size:12px}
table.items td{padding:4px 3px;border-bottom:1px solid var(--line)}
table.items td.q{text-align:right;white-space:nowrap;font-weight:700}
.pk-row{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.pk-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-st{font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 7px;white-space:nowrap}
.truck{background:#f2faf4;border:1.5px dashed #9ad2ae;border-radius:12px;padding:9px 12px;margin-top:9px;font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
.truck b{font-size:15px}
.urgbox{display:flex;gap:6px;margin-bottom:11px}
.urgbox input{flex:1;border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:13px;font-family:inherit;outline:none;background:var(--panel);color:var(--ink)}
/* login */
.login-bg{position:fixed;inset:0;background:linear-gradient(160deg,#0b1120,#1e2b4d);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.login{background:#fff;color:#151b28;border-radius:22px;padding:22px 22px 26px;width:min(420px,100%);box-shadow:0 24px 60px rgba(0,0,0,.4)}
.login h2{margin:0 0 2px;font-size:18px;font-family:'Prompt',sans-serif}
.login .sub{font-size:12px;color:#68738a;margin-bottom:14px}
.lg-branches{display:flex;gap:6px;margin-bottom:12px}
.lg-branches button{flex:1;border:1px solid #e6e6e0;background:#fff;border-radius:11px;padding:10px;font-size:14px;font-weight:700;cursor:pointer;color:#68738a;font-family:inherit}
.lg-branches button.on{background:#151b28;color:#fff;border-color:#151b28}
.lg-staff{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:200px;overflow-y:auto;margin-bottom:12px}
.lg-staff button{border:1px solid #e6e6e0;background:#fff;border-radius:11px;padding:12px 8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.lg-staff button.on{border-color:#1a56db;background:#e9f0ff;color:#1a56db;font-weight:800}
.pinrow{display:flex;justify-content:center;gap:10px;margin:6px 0 12px}
.pindot{width:14px;height:14px;border-radius:50%;border:2px solid #e6e6e0}
.pindot.f{background:#1a56db;border-color:#1a56db}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pinpad button{border:1px solid #e6e6e0;background:#fff;border-radius:13px;padding:15px;font-size:19px;font-weight:800;cursor:pointer;font-family:inherit}
.pinpad button:active{background:#e9f0ff}
.lg-err{color:#d92d20;font-size:12.5px;font-weight:700;text-align:center;min-height:17px;margin-top:8px}
.lg-wait{font-size:12.5px;color:#067647;font-weight:700;text-align:center;margin-top:8px;display:none}
/* ═══ 🌑 Mission Control — บังคับใช้เฉพาะตอน view=board (body.dk) ═══ */
body.dk header{background:#0d1527;border-bottom-color:#1c2b52;box-shadow:none}
body.dk .tab{background:#101a33;border-color:#22305a}
body.dk .tab.on{background:#e6eaf5;color:#0b1120;border-color:#e6eaf5}
body.dk .vtab{background:#101a33;color:#8fa0c9}
body.dk .vtab.on{background:#1a56db;color:#fff;box-shadow:0 0 14px rgba(59,130,246,.45)}
body.dk .userchip{background:#14224a;color:#93c5fd}
body.dk .conn.live{background:#052e1c;color:#34d399;box-shadow:0 0 10px rgba(52,211,153,.35)}
body.dk .col{background:#0d1527;border:1px solid #1c2b52}
body.dk .col-h{box-shadow:inset 0 4px 18px -10px var(--cc)}   /* แถบสีเครื่องเรืองลงมานิด ๆ */
body.dk .col.down{background:#1c0e14;border-color:#7f1d1d}
body.dk .col.down .col-h .dn{animation:ledblink 1.1s infinite}   /* เครื่องเสีย = ไฟกะพริบ เห็นข้ามโรงงาน */
@keyframes ledblink{50%{opacity:.35}}
body.dk .bcard{background:#0f1830;border-color:#1e2c55}
body.dk .strip{background:#16203f}
body.dk .cchip{background:#0a1226;border-color:#1e2c55}
body.dk .cchip i{border-color:rgba(255,255,255,.25)}
body.dk .who b{color:#7dd3fc}
body.dk .btn.grey{background:#16224a;color:#c9d4ef}
body.dk .btn.amber{background:#2a1e07;color:#fbbf24;border-color:#5c4308}
body.dk .btn.red{background:#3a0d0d;color:#f87171}
body.dk .btn.dark{background:#e6eaf5;color:#0b1120}
body.dk .warn{color:#f87171}
body.dk .bdg.late{background:#3a0d0d;color:#f87171}
body.dk .planx{background:#0a1226;border-color:#26335c}
body.dk input,body.dk select,body.dk textarea{background:#0d1527;color:#e6eaf5;border-color:#26335c}
body.dk .planx select{background:#0d1527;color:#e6eaf5}
body.dk .hint{background:#0e1a3a;border-color:#1e2c55;color:#8fa0c9}
body.dk .s-x{background:#16224a;color:#c9d4ef}
body.dk .mchip{background:#14224a;color:#93c5fd}
body.dk .stag{background:#16203f;color:#8291b4}
body.dk .dtag{background:#0d1f16;color:#34d399}
body.dk .oi.noprod{background:#251016}
body.dk .truck{background:#0d1f16;border-color:#14532d}
/* ═══ 📍 ตามใบ + 🎬 ลูกเล่น live (v9.1 — feedback คุณรุ้ง) ═══ */
.flash{animation:flashy 1.1s ease-in-out 3}
@keyframes flashy{0%,100%{box-shadow:0 0 0 0 rgba(26,86,219,0)}50%{box-shadow:0 0 0 5px rgba(26,86,219,.55)}}
body.dk .flash{animation-name:flashydk}
@keyframes flashydk{0%,100%{box-shadow:0 0 0 0 rgba(125,211,252,0)}50%{box-shadow:0 0 0 5px rgba(125,211,252,.6)}}
.ldot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:4px;animation:ledblink 1s infinite;vertical-align:1px}
.strip i.run{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 5px,transparent 5px 10px);background-size:14px 14px;animation:runmove .9s linear infinite}
@keyframes runmove{to{background-position:14px 0}}
/* ═══ 🛫 จอสถานะวันนี้ — ธีมสว่างตามแอป · สลับมืดเมื่อกด 📺 จอ TV ═══ */
.flpage{max-width:1100px}
.flh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:2px 0 14px}
.flh h2{font-family:'Prompt',sans-serif;font-weight:800;font-size:24px;margin:0}
.fldate{color:var(--muted);font-size:13px}
.flsum{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.flsum b{font-size:12.5px;font-weight:700;border-radius:99px;padding:4px 12px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.flsum .s1{color:var(--accent)}
.flsum .s4{color:var(--green)}
.flr{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:9px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.flr.land{opacity:.62}
.flid{flex:0 0 200px;min-width:0}
.flid .so{display:block;font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;font-size:16px;color:var(--accent)}
.flcus{display:block;font-size:13px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flct{font-size:10.5px;color:var(--muted)}
.fltrk{flex:1;min-width:0}
.flbar{position:relative;height:8px;border-radius:99px;background:#e9e9e2;margin:8px 12px 6px 0}
.flbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#1a56db,#22d3ee);transition:width .6s}
.flico{position:absolute;top:-11px;margin-left:-9px;font-size:16px;animation:flbob 1.6s ease-in-out infinite;transition:left .6s}
@keyframes flbob{50%{transform:translateY(-3px)}}
.flr.land .flico{animation:none}
.flsteps{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);padding-right:12px;opacity:.8}
.flsteps .on{color:var(--ink);opacity:1}
.flsteps .now{color:var(--accent);font-weight:700}
.flst{flex:0 0 auto;font-size:13px;font-weight:800;color:var(--sc);background:color-mix(in srgb,var(--sc) 12%,transparent);border:1px solid color-mix(in srgb,var(--sc) 35%,transparent);border-radius:99px;padding:6px 14px}
/* 🌑 เวอร์ชันจอ TV (body.dk) */
body.dk .flsum b{background:#101a33;border-color:#22305a;color:#c9d4ef}
body.dk .flsum .s1{color:#7dd3fc;box-shadow:0 0 10px rgba(56,140,255,.2) inset}
body.dk .flsum .s4{color:#34d399}
body.dk .flr{background:#0f1830;border-color:#1e2c55;box-shadow:none}
body.dk .flid .so{color:#7dd3fc}
body.dk .flcus{color:#cdd7ef}
body.dk .flbar{background:#16203f}
body.dk .flbar i{box-shadow:0 0 8px rgba(34,211,238,.45)}
body.dk .flico{filter:drop-shadow(0 0 6px rgba(34,211,238,.6))}
body.dk .flsteps{color:#5d6b93}
body.dk .flsteps .on{color:#9fb0d8}
body.dk .flsteps .now{color:#7dd3fc}
body.tv .flid{flex-basis:240px}
body.tv .flid .so{font-size:20px}
body.tv .flcus{font-size:16px}
body.tv .flst{font-size:16px;padding:8px 18px}
body.tv .flh h2{font-size:32px}
body.tv .flsteps{font-size:13px}
body.tv .flbar{height:10px}
body.tv .flico{font-size:20px;top:-13px}

<script>
/* ================= CONFIG ================= */
const CONFIG = {
  url: "https://dbbhgacstsddonprgiuo.supabase.co",
  key: "sb_publishable_qeQZH08Oan3cMxmhCNGnVQ_XmOfx4s6"
};

/* ================= DAL (Data Access Layer) =================
   ทุกการคุยกับ Supabase ผ่าน DB เท่านั้น — ทดสอบแทนที่ด้วย window.__MOCK_DB__ ได้ */
let sb = null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
const STAFF_COLS = "id,branch,name,role,can_approve,active,email";
/* ⚡ ดึงเฉพาะคอลัมน์ที่ใช้จริง — so_live/so_item_live/coil_stock มิเรอร์มาจาก DBF คอลัมน์เยอะมาก
   select("*") = ขนของเกินจำเป็นทุกรอบ (ต้นเหตุหลักที่โควตา Supabase เต็ม) */
const COLS = {
  so_live: "branch,sonum,cuscod,cusnam,sodat,dlvdat,docstat,ivnum,synced_at,cancelled_at,cancelled_by,cancel_reason",
  so_item_live: "branch,sonum,seq,stkcod,stkdes,ordqty,remqty,unit",
  coil_stock: "branch,coil_sku,totbal",
  machine: "id,branch,name,sort,status,note",
};
/* คอลัมน์ที่เพิ่งเพิ่มด้วย migration — ถ้าฐานข้อมูลยังไม่มี ให้ตัดทิ้งแล้วเดินต่อ (ฟีเจอร์ปิดตัวเอง)
   ของเดิมที่เคยใช้ได้ต้องใช้ได้ต่อเสมอ ห้ามให้บอร์ดทั้งบอร์ดดับเพราะคอลัมน์ใหม่ยังไม่มา */
let COL_MISS = {};
function dropMissingCol(table, error){
  const msg = (error && (error.message||error.hint||"")) + " " + ((error&&error.code)||"");
  const m = /column\s+(?:\S+\.)?"?([a-z_]+)"?\s+does not exist/i.exec(msg);
  const col = m ? m[1] : null;
  if(!col || !(COLS[table]||"").split(",").includes(col)) return false;
  COLS[table] = COLS[table].split(",").filter(c=>c!==col).join(",");
  COL_MISS[table+"."+col] = true;
  console.warn("ยังไม่มีคอลัมน์ "+table+"."+col+" — ปิดฟีเจอร์ที่ใช้คอลัมน์นี้ไว้ก่อน (รัน migration v8.4)");
  return true;
}
function soCancelReady(){ return !COL_MISS["so_live.cancelled_at"]; }
let DB = {
  async init(){
    await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js");
    sb = window.supabase.createClient(CONFIG.url, CONFIG.key);
  },
  async getStaff(){ const {data,error} = await sb.from("staff").select(STAFF_COLS).eq("active",true).order("id"); if(error) throw error; return data; },
  async verifyPin(id,pin){ const {data,error} = await sb.rpc("verify_pin",{p_staff:id,p_pin:pin}); return !error && data===true; },
  async sendOtp(email){ const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.origin+location.pathname}}); if(error) throw error; },
  async getSessionEmail(){ const {data:{session}} = await sb.auth.getSession(); return session && session.user && session.user.email ? session.user.email.toLowerCase() : null; },
  async signOut(){ try{ await sb.auth.signOut(); }catch(e){} },
  async fetchAll(table, buildQ){
    const out=[];
    for(let i=0;;i+=1000){
      let q = sb.from(table).select(COLS[table]||"*"); if(buildQ) q = buildQ(q);
      const {data,error} = await q.range(i,i+999);
      if(error){
        if(dropMissingCol(table, error)){ i-=1000; continue; }   // ตัดคอลัมน์ที่ยังไม่มีแล้วลองใหม่
        console.error(table,error); break;
      }
      out.push(...data); if(data.length<1000) break;
    }
    return out;
  },
  _cold: null, _coldAt: 0,
  async loadAll(force){
    const cutD = new Date(Date.now()-30*864e5).toISOString().slice(0,10);
    const cutT = new Date(Date.now()-60*864e5).toISOString();
    /* ❄️ เครื่อง/คอยล์/แบบครอบ แทบไม่ขยับระหว่างวัน — โหลดทุก 10 นาทีพอ ไม่ต้องขนทุกรอบ
       (coil_stock 788 แถว = ก้อนใหญ่สุดที่เคยขนทุก 90 วิ โดยไม่มีอะไรเปลี่ยน) */
    const needCold = force || !this._cold || (Date.now()-this._coldAt > 600000);
    const [sos, its, tks, jobs, cold] = await Promise.all([
      this.fetchAll("so_live", q=>q.gte("sodat",cutD)),
      this.fetchAll("so_item_live", q=>q.gte("synced_at",cutT)),
      this.fetchAll("production_ticket", q=>q.gte("created_at",cutT)),
      this.fetchAll("online_job", q=>q.gte("created_at",cutT)),
      needCold ? Promise.all([
        this.fetchAll("machine"),
        this.fetchAll("coil_stock"),
        this.fetchAll("shape_drawing", q=>q.gte("updated_at",cutT)),
      ]) : Promise.resolve(null),
    ]);
    if(cold){ this._cold={machines:cold[0], coils:cold[1], shapes:cold[2]}; this._coldAt=Date.now(); }
    return {sos, its, tks, jobs, ...this._cold};
  },
  /* ถ้ายังไม่ได้รัน migration v8.4 (คอลัมน์ sketch/note ยังไม่มี) ให้บันทึกเฉพาะตัวเลขไปก่อน
     ดีกว่าปล่อยให้ปุ่มบันทึกแบบพังทั้งปุ่ม — ของเดิมที่เคยใช้ได้ต้องใช้ได้ต่อเสมอ */
  async upsertShape(row){
    const {error} = await sb.from("shape_drawing").upsert(row,{onConflict:"branch,sonum,seq"});
    if(!error) return;
    if(!/sketch|note|column/i.test(error.message||"")) throw error;
    const {sketch, note, ...base} = row;
    const r2 = await sb.from("shape_drawing").upsert(base,{onConflict:"branch,sonum,seq"});
    if(r2.error) throw r2.error;
    console.warn("shape_drawing ยังไม่มีคอลัมน์ sketch/note — บันทึกเฉพาะตัวเลข (รัน migration v8.4)");
  },
  async fetchSO(branch, sonum){
    const {data:so} = await sb.from("so_live").select("*").eq("branch",branch).eq("sonum",sonum).maybeSingle();
    if(!so) return null;
    const {data:its} = await sb.from("so_item_live").select("*").eq("branch",branch).eq("sonum",sonum).order("seq");
    return {so, its: its||[]};
  },
  async insertTicket(row){ const {data,error} = await sb.from("production_ticket").insert(row).select("id").single(); if(error) throw error; return data.id; },
  async updateTicket(id,patch){ const {error} = await sb.from("production_ticket").update(patch).eq("id",id); if(error) throw error; },
  /* 👥 เข้าร่วมงานเครื่องจักร — ผ่าน RPC ไม่ใช่ update ตรง
     เพราะช่าง 2-6 คนกด ➕ พร้อมกันได้ ถ้าอ่าน-แก้-เขียนฝั่ง client คนที่กดทีหลังจะทับคนแรกหาย
     ฝั่ง SQL ต่อ array ในคำสั่งเดียว = ใครกดก็ติดครบ */
  async _wk(fn, args){
    const {error} = await sb.rpc(fn, args);
    if(!error) return;
    // ยังไม่ได้รัน migration v8.4 → บอกให้รู้ตรง ๆ ไม่ใช่ "เช็คเน็ต" ซึ่งชี้ผิดทาง
    if(/function|schema cache|does not exist/i.test(error.message||"")) throw new Error("ยังไม่ได้อัปเดตฐานข้อมูล (migration v8.4) — แจ้งแอดมิน");
    throw error;
  },
  async joinWork(id, w){ await DB._wk("join_work",{p_ticket:id, p_staff:w}); },
  async leaveWork(id, sid, at){ await DB._wk("leave_work",{p_ticket:id, p_id:String(sid), p_at:at}); },
  async closeWork(id, at){ await DB._wk("close_work",{p_ticket:id, p_at:at}); },
  async insertEvent(ev){ const {error} = await sb.from("ticket_event").insert(ev); if(error) console.error(error); },
  async getEvents(tid){ const {data} = await sb.from("ticket_event").select("*").eq("ticket_id",tid).order("at",{ascending:false}).limit(60); return data||[]; },
  async insertJob(row){ const {error} = await sb.from("online_job").insert(row); if(error) throw error; },
  async updateJob(id,patch){ const {error} = await sb.from("online_job").update(patch).eq("id",id); if(error) throw error; },
  async setMachine(id,patch){ const {error} = await sb.from("machine").update(patch).eq("id",id); if(error) throw error; },
  /* ❌ ขายยกเลิก SO — เขียนลง so_live ตรง ๆ ปลอดภัย
     so_push upsert แบบ merge-duplicates แตะเฉพาะคอลัมน์ที่มันส่งมา (3 คอลัมน์นี้ไม่เคยอยู่ใน payload)
     ห้ามย้ายไปเก็บที่ so_item_live เด็ดขาด — ตารางนั้นถูก DELETE ทิ้งทั้งชุดแล้ว INSERT ใหม่ทุกรอบ sync */
  async setSOCancel(br, sonum, patch){
    const {error} = await sb.from("so_live").update(patch).eq("branch",br).eq("sonum",sonum);
    if(error){
      if(/column|schema cache/i.test(error.message||"")) throw new Error("ยังไม่ได้อัปเดตฐานข้อมูล (migration v8.4) — แจ้งแอดมิน");

         การ์ดฝั่งขายรอรอบ timer พอ (ช้าสุด 3 นาที) */
      .on("postgres_changes",{event:"*",schema:"public",table:"production_ticket"},cb)
      .on("postgres_changes",{event:"*",schema:"public",table:"machine"},cb)
      .on("postgres_changes",{event:"*",schema:"public",table:"online_job"},cb)

  },

function machineType(stk, des){
  if(stk.startsWith("03VP-PE")) return "PE 5 มม.";
  if(stk.startsWith("03VP-PU")) return /snap|สแน็ป/i.test(des) ? "PU สแน็ปล็อค" : "PU ตรง";
  if(stk.startsWith("03VP")) return null;
  if(stk.startsWith("03S")) return "สเปน";
  if(stk.startsWith("03V")) return "เวนิส";
  if(stk.startsWith("01P3")) return "พาแนล 3 สัน";
  if(stk.startsWith("01P5")) return "พาแนล 5 สัน";
  if(stk.startsWith("01SL")) return "สแน็ปล็อค";
  if(stk.startsWith("01WP")) return "ลอนรั้ว 182";
  if(stk.startsWith("01WR")) return "ลอนฝ้า";
  if(stk.startsWith("01WC")) return "ผนัง 007";
  if(stk.startsWith("01CU")) return "ตรง";
  if(stk.startsWith("01A")) return "ตรง";
  if(/บานเกล็ด/.test(des)) return "บานเกล็ด";
  if(stk.startsWith("02")){
    if(/ตามแบบ/.test(des)) return "พับครอบ";
    if(/จั่ว/.test(des)) return "ครอบจั่ว";
    return "ครอบข้าง";
  }
  return null;
}
function foldCapNeeded(des, mw){
  // ครอบที่ไม่ตรงหน้ารีดมาตรฐานของเครื่องรีด → ต้องไปเครื่องพับครอบ
  const d = des||"";
  if(new RegExp(mw+"\\s*-\\s*\\d").test(d)) return true;   // มี suffix เช่น 457-10 / 457-15 / 304-12 = ครอบพับ
  const other = mw==="457" ? "304" : "457";
  if(d.includes(other)) return true;                        // หน้ากว้างคนละแบบกับเครื่องรีดของสาขา
  return false;
}
const isOnlineSO = so => /^O/.test(so||"") && !/^SO/.test(so||"");   // เผื่อเลข SO ขึ้นต้น O (ชุดพิเศษ)
const isOnlineCus = cc => /^O/.test(cc||"");                          // งานออนไลน์จริง = รหัสลูกค้าขึ้นต้น O (O610310888=Shopee, O610310777=TikTok, ...)
const cardOnline = c => isOnlineCus(c && c.cusCode) || isOnlineSO(c && c.so);
function resolveMachine(br, type, customer, des, isOnline){
  const list = MACHINES[br]||[];
  if(type==="ตรง"){
    if(list.includes("ตรง")) return "ตรง";
    const L = list.find(m=>m.startsWith("ตรง-L")), R = list.find(m=>m.startsWith("ตรง-R"));
    if(L && R) return R;   // Gem เคาะ 20 ก.ค.: ไม่เลือก = ตรง-R แดง ปีกขวาเสมอ — ทีมผลิตเลือก/ย้ายไป L ได้ตอนวางแผนหรือปุ่ม ⇄ บนบอร์ด
    return L||R||type;
  }
  if(type==="ครอบจั่ว"||type==="ครอบข้าง"){
    const m = list.find(x=>x.startsWith(type));
    const fold = list.includes("พับครอบ") ? "พับครอบ" : null;
    if(!m) return fold||type;
    const mw = (m.match(/(\d{3})/)||[])[1];                 // หน้ารีดของเครื่องสาขานี้: 457 หรือ 304
    if(mw && fold && foldCapNeeded(des, mw)) return fold;
    return m;
  }
  return type;
}
function machineOf(stk, des, br, customer, isOnline){
  const t = machineType(stk, des);
  return t ? resolveMachine(br||branch, t, customer, des, isOnline) : null;
}
function coilKeyOf(stk){
  if(stk.startsWith("03VP-PU")) return "PU:"+stk.slice(5);
  if(stk.startsWith("03VP")) return null;
  const m = stk.match(/^0[123][A-Z0-9]*-([A-Z0-9]+)-(\d{3})-?([A-Z0-9]*)/);
  return m ? m[1]+"-"+m[2]+(m[3]?"-"+m[3]:"") : null;
}
function thickOf(key){ const m=(key||"").match(/-(\d{3})(-|$)/); return m? +m[1]/100 : 0.35; }
function labelOf(des, key){
  if((key||"").startsWith("PU:")) return des;
  let s = des.replace(/^[\d.]+\s*-\s*[\d.]+\s*/,"").trim();
  const t = s.split(/\s+/);
  if(t.length>1 && !/0\.\d{2}/.test(t[0])) t.shift();
  return t.join(" ") || des.slice(0,40);
}
const SW=[["ดำ","#23272e"],["เทาเข้ม","#4a5568"],["เทา","#9aa5b1"],["ซิงค์","#c3cad2"],["ขาว","#f2f2ef"],["ครีม","#e9ddc0"],["แดง","#c0392b"],["ส้ม","#e67e22"],["เหลือง","#f1c40f"],["เขียว","#1e8e3e"],["ฟ้า","#3498db"],["น้ำเงิน","#1f4e9e"],["น้ำตาล","#7a4a21"],["ไม้","#8b5e34"],["อิฐ","#a4453a"],["ม่วง","#7d3c98"]];
function swc(l){ for(const [k,v] of SW) if((l||"").includes(k)) return v; return "#b8c0cc"; }
function lenCnt(des, qty){
  const m = des.match(/^([\d.]+)\s*-\s*([\d.]+)/);
  if(m){ const L=+m[1], n=+m[2];
    if(L>0 && Math.abs(L*n-qty)/Math.max(qty,1) < .05) return [L, Math.round(n)];
    if(L>0) return [L, Math.round(qty/L)];
  }
  return [null, null];
}
function coilStock(br, key){
  if(!key || key.startsWith("PU:")) return null;

  if(("ZZC-"+key) in c) return c["ZZC-"+key];
  const nk = key.replace(/-[A-Z0-9]+$/,"");
  if(("ZZC-"+nk) in c) return c["ZZC-"+nk];
  return null;
}

function nowT(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function fmtT(iso){ if(!iso) return "—"; const d=new Date(iso);
  const dd=String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
  const hh=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  return (iso.slice(0,10)===todayISO? "" : dd+" ")+hh;   // วันนี้โชว์แค่เวลา วันอื่นมี วัน/เดือน นำหน้า

function durTxt(a,b){
  if(!a||!b) return null;
  const m=Math.round((new Date(b)-new Date(a))/60000);
  if(m<0) return null;
  if(m<60) return m+" นาที";
  const h=Math.floor(m/60);
  if(h<24) return h+" ชม. "+(m%60)+" น.";
  return Math.floor(h/24)+" วัน "+(h%24)+" ชม.";
}

let USER=null, STAFF=[], TK=[], JOBS=[], COILS={}, CARDS={SKN:[],BK:[],PPS:[]}, SYNCMAX={}, CUSOF={}, SHAPES={};

/* ใบที่ยังมีชีวิตอยู่ในไลน์ — ตัดทั้งใบที่ปลายทางปฏิเสธ และใบที่ถูกยกเลิกทิ้ง

const alive = t => !t.by.rejected && !t.by.cancelled;
function tks(){ return TK.filter(t=>t.branch===branch && alive(t)); }
function tksOf(br){ return TK.filter(t=>t.branch===br && alive(t)); }

function findSO(so, br){
  // เลข SO ซ้ำข้ามสาขาได้ (Express รันแยกสาขา) — หาในสาขาที่ระบุ/สาขาปัจจุบันก่อนเสมอ
  return CARDS[br||branch].find(c=>c.so===so) || CARDS.SKN.concat(CARDS.BK,CARDS.PPS).find(c=>c.so===so) || jobMeta(so);
}
function jobMeta(so){
  const j = JOBS.find(j=>j.order_no===so);
  return j ? {so:j.order_no, customer:"🛍 "+j.platform+" · "+j.receiver, due:todayISO, cusCode:"", docstat:"N", items:[]} : null;
}
function orderedIdx(so){
  const s=new Set();
  // ใบที่ยกเลิกไปแล้วต้องไม่นับว่า "สั่งไปแล้ว" — ไม่งั้นขายสั่งรายการเดิมซ้ำไม่ได้ ต้องไปขออนุมัติซ้ำทั้งที่ใบเก่าถูกทิ้งแล้ว
  TK.filter(t=>t.so===so && alive(t)).forEach(t=>t.idxs.forEach(x=>s.add(x)));
  return s;
}
function sentTo(so, seq){
  const t = TK.find(t=>t.xborder && t.so===so && t.fromBranch===branch && t.idxs.includes(seq) && alive(t));
  return t ? t.branch : null;
}
function tItems(t){
  if(t.oitems && t.oitems.length) return t.oitems;
  const c = findSO(t.so, t.branch);
  if(!c) return [];
  if(t.urgent && !t.idxs.length) return c.items;   // ใบด่วนที่สร้างก่อน SO sync = คลุมทั้งใบ → พอ SO มาแล้วดึงรายการ/ความยาวให้อัตโนมัติ
  return c.items.filter(i=>t.idxs.includes(i.seq));
}
function tMetrics(t){
  const its = tItems(t);
  if(!its.length && t.met) return t.met;   // ใช้ค่าที่บันทึกไว้ตอนสร้าง (SO เก่าหลุดหน้าต่างโหลด)
  let m=0, sh=0, mx=0;
  its.forEach(i=>{ if(i.unit==="มร"){ m+=i.qty; const [L,n]=lenCnt(i.des,i.qty); if(n){sh+=n; mx=Math.max(mx,L);} } });
  const kg = m*WIDTH_M*thickOf(t.key)*DENS;
  return {m, sh, mx, kg};
}

/* ================= data mapping ================= */
function applyData(d){
  // machines
  MACHINES={SKN:[],BK:[],PPS:[]}; DOWN={}; MACH_NOTE={}; MACH_ID={};
  d.machines.sort((a,b)=>a.sort-b.sort).forEach(m=>{
    (MACHINES[m.branch]=MACHINES[m.branch]||[]).push(m.name);
    if(m.status==="down") (DOWN[m.branch]=DOWN[m.branch]||[]).push(m.name);
    if(m.note) MACH_NOTE[m.branch+"|"+m.name]=m.note;
    MACH_ID[m.branch+"|"+m.name]=m.id;
  });
  // coils
  COILS={SKN:{},BK:{},PPS:{}};
  d.coils.forEach(c=>{ (COILS[c.branch]=COILS[c.branch]||{})[c.coil_sku]=+c.totbal; });
  // SO cards
  const itBySo={};
  d.its.sort((a,b)=>a.seq-b.seq).forEach(r=>{
    (itBySo[r.branch+"|"+r.sonum]=itBySo[r.branch+"|"+r.sonum]||[]).push(
      {seq:r.seq, stk:r.stkcod||"", des:r.stkdes||"", qty:+r.ordqty||0, rem:+r.remqty||0, unit:r.unit||""});
  });
  CARDS={SKN:[],BK:[],PPS:[]}; SYNCMAX={}; CUSOF={};
  const cutM = new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  d.sos.forEach(r=>{
    if(!CARDS[r.branch]) return;
    CUSOF[r.branch+"|"+r.sonum]=r.cuscod||"";
    if(!SYNCMAX[r.branch] || r.synced_at>SYNCMAX[r.branch]) SYNCMAX[r.branch]=r.synced_at;
    if(r.docstat==="C") return;
    if(r.docstat==="M" && (r.sodat||"") < cutM) return;  // ขายสดตัดบิลแล้ว โชว์ 7 วัน
    CARDS[r.branch].push({so:r.sonum, date:r.sodat, due:r.dlvdat, cusCode:r.cuscod||"",
      customer:r.cusnam||r.cuscod||"", docstat:r.docstat, iv:r.ivnum||"", items:itBySo[r.branch+"|"+r.sonum]||[],
      /* ❌ ขายยกเลิกเอง — ไม่ทิ้งการ์ด แค่ย้ายไปกล่องพับ เพราะกดคืนได้ในคลิกเดียว */
      x:!!r.cancelled_at, xat:r.cancelled_at||"", xby:r.cancelled_by||"", xreason:r.cancel_reason||""});
  });
  // ใบเก่าที่เคยดึงมาด้วยมือ — คงไว้หลัง reload
  ["SKN","BK","PPS"].forEach(b=>Object.values(FETCHED[b]).forEach(c=>{
    if(!CARDS[b].find(x=>x.so===c.so)) CARDS[b].push(c);
  }));
  Object.values(CARDS).forEach(v=>v.sort((a,b)=>(a.due||"9999")<(b.due||"9999")?-1:1));
  // 📐 แบบครอบตามแบบ (วาดจากระยะจริง)
  SHAPES={};
  (d.shapes||[]).forEach(s=>{ SHAPES[s.branch+"|"+s.sonum+"|"+s.seq]=s; });
  // jobs
  JOBS = d.jobs;
  // tickets
  TK = d.tks.map(r=>({
    id:r.id, branch:r.branch, so:r.sonum, mach:r.machine, key:r.material_key||null,
    label:r.label, idxs:r.item_seqs||[], oitems:r.oitems,
    online:r.source==="online" || isOnlineSO(r.sonum) || isOnlineCus(CUSOF[r.branch+"|"+r.sonum]), xborder:r.source==="xborder", urgent:r.source==="urgent",
    stock:r.source==="stock",   // 🏭 ผลิตเก็บเข้าสต็อค — ไม่มี SO ไม่มีลูกค้า ปลายทางคือคลัง
    fromBranch:r.from_branch, soCover:r.so_cover||"", st:r.stage, route:r.route,
    assignee:r.assignee||"", priority:r.priority||0, coil_lot:r.coil_lot||"", waste:r.waste_note||"",
    by:r.people||{}, wk:r.workers||[],   // 👥 คนที่เข้าร่วมงานใบนี้ [{id,name,in,out}] — ใบเก่าไม่มี = []
    met:{m:+r.prod_m||0, sh:+r.sheets||0, mx:+r.max_len||0, kg:+r.weight_kg||0},
    tm:{ordered:r.created_at, ...(r.source!=="xborder"?{approved:r.created_at}:{}), ...(r.times||{})},  // ใบเก่าไม่มี times → ใช้เวลาออกใบแทน
    created:r.created_at
  }));
  loaded=true;
}
/* คืน true เมื่อข้อมูลขยับจริง — ถ้าเหมือนเดิมไม่ต้อง applyData/วาดจอใหม่ (กันจอกระตุกตอนเลื่อน/พิมพ์) */
let SIG="";
function sigOf(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return h+"."+s.length; }
async function reload(force){
  const d = await DB.loadAll(force);
  const sg = sigOf(JSON.stringify(d));
  if(loaded && sg===SIG) return false;
  SIG=sg; applyData(d); return true;
}

function metricsOf(items, key){
  let m=0,sh=0,mx=0;
  items.forEach(i=>{ if(i.unit==="มร"){ m+=i.qty; const [L,n]=lenCnt(i.des,i.qty); if(n){sh+=n; mx=Math.max(mx,L);} } });
  return {mat_m:m, prod_m:m, weight_kg:Math.round(m*WIDTH_M*thickOf(key)*DENS*100)/100, sheets:sh, max_len:mx};
}
const nowISO = () => new Date().toISOString();
const isStepKey = k => !/_(note|reason)$/.test(k);   // people มีทั้งชื่อคน (ขั้นตอน) และข้อความประกอบ
async function newTicket(row, action, detail){
  // 🕐 เวลาเป็น key ของ process — ประทับเวลาทุกบทบาทที่ถูกเซ็ตตอนออกใบ (ordered/approved/…)
  // (_note/_reason เป็นข้อความประกอบ ไม่ใช่ขั้นตอน → ไม่ประทับเวลา)
  if(row.people) row.times = Object.keys(row.people).filter(isStepKey).reduce((o,k)=>(o[k]=nowISO(),o),{});
  const id = await DB.insertTicket(row);
  await DB.insertEvent({ticket_id:id, staff_id:USER.dbid||null, staff_name:USER.name, action, to_stage:row.stage, detail:detail||""});
  return id;
}
async function patchTicket(t, patch, action, detail){
  // 🕐 บทบาทใหม่ที่เพิ่งถูกเซ็ต (planned/started/done/packed/shipped/arrived/accepted/…) → ประทับเวลาอัตโนมัติ
  if(patch.people){
    const nt={...(t.tm||{})};
    Object.keys(patch.people).forEach(k=>{ if(patch.people[k] && isStepKey(k) && !(t.by||{})[k]) nt[k]=nowISO(); });
    // เวลาที่ผู้เรียกส่งมาเองต้องชนะเวลาอัตโนมัติ (พักงาน/ทำต่อ เขียน tm.paused / tm.pause_min เอง)
    patch.times={...nt, ...(patch.times||{})};
  }
  await DB.updateTicket(t.id, patch);
  await DB.insertEvent({ticket_id:t.id, staff_id:USER.dbid||null, staff_name:USER.name, action,
    from_stage:t.st, to_stage:patch.stage!==undefined?patch.stage:t.st, detail:detail||""});
}

function orderProduce(so, isRe){
  const c=findSO(so); if(!c) return;
  const done=orderedIdx(so), byKey={};
  const approver = REOK[so];
  if(isRe && !approver) return;   // สั่งซ้ำต้องผ่านอนุมัติก่อนเท่านั้น
  c.items.forEach(it=>{
    if(done.has(it.seq) && !isRe) return;
    const mach=machineOf(it.stk,it.des,branch,c.customer,cardOnline(c));
    if(!mach) return;
    let useMach=mach;
    if(!canProduce(branch,mach)){
      // เครื่องเสีย/ไม่มีเครื่อง → ใช้ทางออกที่ขายเลือกไว้: เข้าคิวเครื่องที่รอซ่อม หรือ งานพับมือ
      const alt=document.getElementById("alt-"+so+"-"+it.seq);
      if(!alt || !alt.value) return;
      useMach=alt.value;
    }
    const cb=document.getElementById("cb-"+so+"-"+it.seq);
    if(cb && cb.checked){ const k=useMach+"|"+(coilKeyOf(it.stk)||"-"); (byKey[k]=byKey[k]||[]).push(it); }
  });
  const ks=Object.keys(byKey); if(!ks.length) return;
  act(async ()=>{
    for(const k of ks){
      const [mach,key]=k.split("|");
      const its=byKey[k], kk=key==="-"?null:key;
      const reDup = isRe && its.some(i=>done.has(i.seq));
      const people = {ordered:USER.name, approved:USER.name};
      if(reDup){ people.reorder_approved = approver.name; people.reorder_reason = approver.reason; }
      await newTicket({branch, source:"so", sonum:so, machine:mach, material_key:kk||"",
        label:labelOf(its[0].des,kk), item_seqs:its.map(i=>i.seq), stage:1,
        people, created_by:USER.dbid||null,
        ...metricsOf(its,kk)},
        "create", reDup
          ? "🔁 สั่งผลิตซ้ำ ("+its.length+" รายการ) — ขอโดย "+USER.name+" · อนุมัติซ้ำโดย "+approver.name+" · สาเหตุ: "+approver.reason
          : "🛒 สั่ง+อนุมัติใบผลิต ("+its.length+" รายการ) → เข้าฝั่งผลิตทันที");
    }
    delete REOK[so];
  });
}

  const now=nowISO(), was=(t.tm||{}).paused;
  const by={...t.by};  delete by.paused; delete by.pause_reason;
  /* ต้องเซ็ต null ไม่ใช่ delete — patchTicket เอา t.tm ตัวเก่ามาเป็นฐานแล้ว merge ทับ
     คีย์ที่ลบทิ้งเฉย ๆ จะฟื้นกลับมาจากฐาน แล้วใบจะค้างสถานะ "พักอยู่" ตลอดกาล */
  const tm={...(t.tm||{}), paused:null};
  tm.pause_min = (+((t.tm||{}).pause_min)||0) + (durMin(was, now)||0);
  tm.resumed = now;
  /* ไม่บังคับให้คนเดิมกลับมา — กะเช้าอาจเป็นคนละคนกับกะที่พักไว้ ใครมาถึงก่อนกดทำต่อได้เลย
     แต่ event บันทึกไว้ว่าใครกด → ตรวจย้อนได้ว่าใบนี้ข้ามมือใครบ้าง */
  act(()=>patchTicket(t,{people:by, times:tm}, "resume",
    "▶ ทำต่อ (พักไป "+(durTxt(was, now)||"—")+") · พักครั้งก่อน: "+((t.by||{}).pause_reason||"—")));
}
/* ผลิตจริง = เริ่ม→เสร็จ ลบเวลาที่พัก — นี่คือทั้งหมดที่ฟีเจอร์พักงานมีค่า
   ถ้าไม่หัก ใบค้างคืนจะโชว์ "ผลิต 16 ชม." ทั้งที่ลงมือจริง 40 นาที แล้วรายงานทั้งแท็บก็เชื่อไม่ได้ */
function prodMin(t){
  const T=t.tm||{};
  const raw = durMin(T.started, T.done || (T.started? nowISO() : null));
  if(raw===null) return null;
  const pz = (+T.pause_min||0) + (paused(t)? (durMin(T.paused, nowISO())||0) : 0);
  return Math.max(0, raw - pz);
}
/* ================= ❌ ยกเลิกใบผลิต =================
   Gem 26 ก.ค.: "ใบผลิตยกเลิกก็มี แต่ต้องทิ้งร่องรอยไว้ด้วย ใครอนุมัติ ใครยกเลิก"
   → เก็บ 2 ชื่อเสมอ: คนขอยกเลิก (คนที่กด) + คนอนุมัติ (เลือกชื่อ + PIN) — pattern เดียวกับขออนุมัติสั่งซ้ำที่ทีมคุ้นแล้ว
   ใบไม่ถูกลบทิ้ง แค่หลุดจากบอร์ด (alive) — ตัวใบ + events ยังอยู่ครบใน DB ตรวจย้อนหลังได้ตลอด
   ยกเลิกหลังลงมือผลิตแล้ว (st>=3) บังคับให้กรอกว่าตัดไปแล้วเท่าไหร่ ไม่งั้นวัตถุดิบหายเงียบ ๆ ไม่มีใครรู้ */
async function cancelTicket(id){
  const t=tks().find(t=>t.id===id); if(!t) return;
  const rSel=document.getElementById("xr-"+id), rNote=document.getElementById("xn-"+id);
  const sel=document.getElementById("xa-"+id), pin=document.getElementById("xp-"+id);
  const made=document.getElementById("xm-"+id);
  const reason=((rSel&&rSel.value)||"").trim();
  if(!reason){ alertBar("เลือกสาเหตุที่ยกเลิกก่อน (บังคับ)"); return; }
  if(t.st>=3 && !((made&&made.value)||"").trim()){ alertBar("ใบนี้ลงมือผลิตไปแล้ว — ต้องระบุว่าตัด/พับไปแล้วเท่าไหร่ (เป็นเศษ)"); return; }
  const s=STAFF.find(x=>x.id===+((sel&&sel.value)||0));
  if(!s || (((pin&&pin.value)||"").length<4)){ alertBar("เลือกผู้อนุมัติ + ใส่ PIN 4 หลัก"); return; }
  const ok=await DB.verifyPin(s.id, pin.value);
  if(!ok){ alertBar("PIN ไม่ถูกต้อง"); if(pin) pin.value=""; return; }
  const full = reason + ((rNote&&rNote.value.trim())? " — "+rNote.value.trim() : "");
  const mk = ((made&&made.value)||"").trim();
  const now = nowISO();
  const ppl = {...t.by, cancelled:USER.name, cancel_approved:s.name, cancel_reason:full, cancel_stage:String(t.st)};
  if(mk) ppl.cancel_made_note = mk;              // ลงท้าย _note → isStepKey ข้าม ไม่ประทับเวลาให้
  act(async ()=>{
    if(openWk(t).length) await DB.closeWork(t.id, now);
    await patchTicket(t,{people:ppl, times:{...(t.tm||{}), cancelled:now}}, "cancel",
      `❌ ยกเลิกใบตอน "${STG[t.st]}" · ขอโดย ${USER.name} · อนุมัติ ${s.name} · ${full}${mk?" · ผลิตไปแล้ว "+mk:""}`);
  }).then(()=>{ delete XSHOW[id]; if(openId===id) openId=null; render(); });
}

/* 🧾 เช็ค "ของที่ผลิตแล้วต้องตรงกับ IV" (Gem+Finny 3 ส.ค.)
   หลัก: OESOIT.REMQTY = จำนวนที่ยังไม่ถูกดึงเข้าบิล — ถ้า SO ออก IV แล้ว
   แต่รายการที่เรา "ออกใบผลิตไปแล้ว" ยัง rem > 0 = บิลตัดไม่ครบ/ไม่ตรง
   → เตือนทีมจัดส่ง + ขาย/คนเช็คของ ก่อนของขึ้นรถ */
function ivGap(so){
  const c=findSO(so); if(!c || !c.iv) return [];
  const seqs=new Set();
  TK.filter(t=>t.branch===branch && t.so===so && alive(t) && !t.stock)
    .forEach(t=>(t.idxs||[]).forEach(x=>seqs.add(x)));
  return (c.items||[]).filter(i=>seqs.has(i.seq) && (+i.rem||0) > 0);
}
function ivGapHtml(so){
  const g=ivGap(so); if(!g.length) return "";
  return `<div class="warn" style="margin:4px 0 6px">🧾⚠ <b>IV ตัดไม่ครบ ${g.length} รายการ</b> — ผลิตแล้วแต่บิลยังไม่ตัด: ${g.slice(0,2).map(i=>esc(i.des)).join(" · ")}${g.length>2?" …":""}<br><span style="color:var(--muted);font-weight:400">แจ้งฝ่ายขาย/คนเช็คของ เทียบใบผลิตกับ IV ก่อนปล่อยรถ</span></div>`;
}

        FETCHED[branch][c.so]=c;
        if(!CARDS[branch].find(x=>x.so===c.so)) CARDS[branch].push(c);

function makeOnlineTickets(jobId){
  const j=JOBS.find(j=>j.id===jobId); if(!j||j.status!=="new") return;
  const byKey={};
  (j.items||[]).forEach(it=>{
    const mach=machineOf(it.stk,it.des,branch,j.platform);

/* ================= 🏭 ผลิตเก็บเข้าสต็อค (ไม่มี SO / ไม่มีลูกค้า) =================
   Gem เคาะ: ไม่เปิด SO ปลอมเพื่อผลิตเข้าสต็อค (จะปนยอดขาย/บัญชี) — ออกใบตรงในแอปผลิต
   เลขใบ ST<yymmdd>-nn · ปลายทาง = คลัง ไม่เข้าโมดูลแพ็ค/ส่งลูกค้า · นับรวมในรายงานเวลา/คอขวดเสมอ
   ผลิตเสร็จ → กด "เก็บเข้าสต็อค" → ยอดนี้คือจุดเชื่อมที่ 007 Omnichannel Stock System จะมารับต่อ */
function stockNo(){
  const pre = "ST" + new Date().toISOString().slice(2,10).replace(/-/g,"") + "-";
  return pre + String(TK.filter(t=>t.branch===branch && String(t.so||"").startsWith(pre)).length+1).padStart(2,"0");

function parseLines(txt){
  return String(txt||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split("|").map(x=>x.trim());
    return {stk:p[0]||"", des:p[1]||p[0]||"", qty:+(p[2]||0), unit:p[3]||"มร"};
  }).filter(i=>i.stk&&i.qty>0);
}

  const byKey={}, skip=[];
  items.forEach(it=>{
    const mach=machineOf(it.stk,it.des,branch);

  });

  act(async ()=>{
    for(const [k,its] of Object.entries(byKey)){
      const [mach,key]=k.split("|"); const kk=key==="-"?null:key;

  if(skip.length) alertBar("ข้าม "+skip.length+" รายการที่สาขานี้ผลิตไม่ได้: "+skip.slice(0,2).join(" · "));
}

/* 📥 นำเข้าไฟล์ออเดอร์จาก Seller Center (Shopee orders.xlsx / TikTok OrderSKUList.xlsx) */
function parsePlatformRows(rows){
  const H=(rows[0]||[]).map(x=>String(x||"").trim());
  const iOf=names=>H.findIndex(h=>names.some(n=>h.startsWith(n)));
  let plat=null, C=null;
  if(H.some(h=>h.startsWith("หมายเลขคำสั่งซื้อ"))){
    plat="Shopee";
    C={order:iOf(["หมายเลขคำสั่งซื้อ"]), status:iOf(["สถานะการสั่งซื้อ"]), sku:iOf(["เลขอ้างอิง SKU"]),
       name:iOf(["ชื่อสินค้า"]), vari:iOf(["ชื่อตัวเลือก"]), qty:iOf(["จำนวน"]), rqty:iOf(["จำนวนที่ส่งคืน"]),
       buyer:iOf(["ชื่อผู้ใช้"]), recv:-1};
  } else if(H.includes("Order ID")){
    plat="TikTok";
    C={order:iOf(["Order ID"]), status:iOf(["Order Status"]), sku:iOf(["Seller SKU"]),
       name:iOf(["Product Name"]), vari:iOf(["Variation"]), qty:iOf(["Quantity"]), rqty:iOf(["Sku Quantity of return"]),
       buyer:iOf(["Buyer Username"]), recv:iOf(["Recipient"])};
  } else return null;
  const orders={}, returns=[];
  rows.slice(1).forEach(r=>{
    const ord=String(r[C.order]||"").trim();
    const qty=Math.round(+r[C.qty]||0), rq=Math.round(+r[C.rqty]||0);
    if(!ord || (!qty && !rq)) return;   // ข้ามแถวว่าง + แถวคำอธิบายของ TikTok (qty ไม่ใช่ตัวเลข)
    const item={stk:String(r[C.sku]||"").trim(), des:(String(r[C.name]||"").slice(0,60)+" · "+String(r[C.vari]||"")).replace(/\s+·\s*$/,"").trim(), qty, unit:"ชิ้น"};
    if(rq>0) returns.push({platform:plat, order:ord, ...item, rqty:rq});
    if(!/ที่ต้องจัดส่ง|ที่จะจัดส่ง|To\s*ship|Awaiting/i.test(String(r[C.status]||""))) return;   // เอาเฉพาะออเดอร์ที่ต้องจัดส่ง
    const o=orders[ord]=orders[ord]||{receiver:String((C.recv>=0&&r[C.recv])||r[C.buyer]||"").trim(), items:[]};
    o.items.push(item);
  });
  return {platform:plat, orders, returns};
}
async function importTags(){
  if(BUSY) return;
  const f=document.getElementById("imp-file");
  if(!f||!f.files||!f.files.length){ alertBar("เลือกไฟล์ .xlsx ที่ export จาก Seller Center ก่อน"); return; }
  BUSY=true; document.body.classList.add("busy");
  try{
    if(!window.XLSX){
      await new Promise((res,rej)=>{ const s=document.createElement("script");
        s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    }
    const buf=await f.files[0].arrayBuffer();
    const wb=XLSX.read(buf,{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false});
    const p=parsePlatformRows(rows);
    if(!p){ alertBar("ไม่รู้จักรูปแบบไฟล์ — ต้องเป็น export ออเดอร์จาก Shopee/TikTok"); BUSY=false; document.body.classList.remove("busy"); return; }
    let ok=0, dup=0;
    for(const [ord,o] of Object.entries(p.orders)){
      if(JOBS.some(j=>j.branch===branch&&j.order_no===ord)){ dup++; continue; }
      try{ await DB.insertJob({branch, platform:p.platform, order_no:ord, receiver:o.receiver, items:o.items, created_by:USER.dbid||null}); ok++; }
      catch(e){ dup++; }
    }
    await reload();
    alertBar("📥 "+p.platform+": นำเข้า "+ok+" ออเดอร์"+(dup?" · ข้ามที่มีแล้ว "+dup:"")+(p.returns.length?" · ⚠ พบรายการคืน "+p.returns.length+" แถว (โมดูลรับคืนกำลังตามมา)":""));
    if(f) f.value="";
  }catch(e){ console.error(e); alertBar("นำเข้าไม่สำเร็จ — เช็คไฟล์/เน็ตแล้วลองใหม่"); }
  BUSY=false; document.body.classList.remove("busy");
  render();
}
function addJobGo(){
  const g=id=>document.getElementById(id).value.trim();
  const plat=g("aj-plat"), ord=g("aj-ord").toUpperCase(), recv=g("aj-recv"), lines=g("aj-items");
  if(!ord||!lines) return;
  const items=lines.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split("|").map(x=>x.trim());
    return {stk:p[0]||"", des:p[1]||p[0]||"", qty:+(p[2]||0), unit:p[3]||"มร"};
  }).filter(i=>i.stk&&i.qty>0);
  if(!items.length) return;
  act(()=>DB.insertJob({branch, platform:plat||"อื่นๆ", order_no:ord, receiver:recv, items, created_by:USER.dbid||null}));
}

function timeLine(t){
  // 🕐 เวลาเป็น key ของ process: ออกใบ → อนุมัติ → วางแผน → เริ่ม (รอคิวนานเท่าไหร่) → เสร็จ (ผลิตจริงกี่นาที)
  const T=t.tm||{};
  const apr = t.xborder ? T.accepted : (T.approved||T.ordered);
  let s = `🕐 ออกใบ <b>${fmtT(T.ordered)}</b> · อนุมัติ <b>${apr?fmtT(apr):"⏳ รอฝั่งรับ"}</b>`;
  if(T.planned) s += ` · วางแผน <b>${fmtT(T.planned)}</b>`;
  if(T.started){ const w=durTxt(apr||T.ordered, T.started); s += ` · เริ่ม <b>${fmtT(T.started)}</b>${w?` <span class="dur">รอคิว ${w}</span>`:""}`; }
  // ⏸ เวลาที่พักต้องโชว์แยก ไม่งั้นตัวเลข "ผลิต" ของใบค้างคืนจะดูเหมือนช่างทำงาน 16 ชม.
  const pz=(+T.pause_min||0)+(paused(t)?(durMin(T.paused,nowISO())||0):0);
  if(pz) s += ` · <span class="dur" style="color:#b54708">⏸ พักรวม ${fmtMin(pz)}</span>`;
  if(T.done){ const p=durTxt(T.started, T.done), pm=prodMin(t); s += ` · เสร็จ <b>${fmtT(T.done)}</b>${p?` <span class="dur">ผลิต ${pz&&pm!==null?fmtMin(pm)+" (สุทธิ)":p}</span>`:""}`; }
  if(T.cancelled) s += ` · <b style="color:#d92d20">❌ ยกเลิก ${fmtT(T.cancelled)}</b>`;
  if(T.stocked) s += ` · เก็บเข้าสต็อค <b>${fmtT(T.stocked)}</b>`;

/* ================= 🛫 จอสถานะวันนี้ (flight board) =================
   เปิดบนจอ TV ที่สาขา — ลูกค้าเห็น "งานของฉันถึงไหนแล้ว" เหมือนจอสนามบิน
   ความเป็นส่วนตัว: ชื่อลูกค้าถูกย่อ (คำแรกเต็ม + คำถัดไปโชว์แค่ต้นชื่อ)
   ลูกค้าจำเลข SO จากบิลตัวเองได้อยู่แล้ว — คนอื่นเห็นก็ไม่รู้ว่าใคร */
function maskCus(n){
  const t=String(n||"").trim().split(/\s+/);
  if(!t[0]) return "";
  const cut=w=>{ const c=Array.from(w); return c.length<=4? w : c.slice(0,4).join("")+"…"; };
  return t.length===1 ? cut(t[0]) : t[0]+" "+cut(t[1]);
}
const FSTEP=["รับออเดอร์","กำลังผลิต","ผลิตครบ","ขึ้นรถ","ถึงมือลูกค้า"];
function countUp(el){   // 🔢 ตัวเลขนับขึ้น (ease-out ~0.7s) — เล่นเฉพาะตอนเพิ่งเข้าจอ
  const v=+el.dataset.v||0; if(!v){ el.textContent="0"; return; }
  const t0=performance.now(), dur=700;
  const step=n=>{ const p=Math.min(1,(n-t0)/dur); el.textContent=Math.round(v*p*(2-p)); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function fpos(st){ return st>=7?4 : st>=6?3 : st===5?2.5 : st===4?2 : st===3?1 : 0; }
function vFlight(){

      <div class="fltrk">
        <div class="flbar"><i style="width:${pct}%"></i><span class="flico" style="left:${pct}%">${ico}</span></div>
        <div class="flsteps">${FSTEP.map((nm,i)=>`<span class="${i<=x?"on":""}${i===Math.floor(x)&&r.bmin<7?" now":""}">${nm}</span>`).join("")}</div>

  ${act.length? act.map(flr).join("") : `<div class="empty" style="font-size:15px;padding:30px 0">— วันนี้ยังไม่มีงานค้างในไลน์ผลิต —</div>`}

function durMin(a,b){ if(!a||!b) return null; const m=(new Date(b)-new Date(a))/60000; return m>=0? m : null; }
function fmtMin(m){
  if(m===null||isNaN(m)) return "—";
  m=Math.round(m);
  if(m<60) return m+" น.";
  const h=Math.floor(m/60);
  if(h<24) return h+" ชม. "+(m%60)+" น.";
  return Math.floor(h/24)+" วัน "+(h%24)+" ชม.";
}
function avg(arr){ return arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : null; }

    // ⏸ ใช้ prodMin ไม่ใช่ started→done ดิบ — ใบค้างคืนใบเดียวจะดึงค่าเฉลี่ยเครื่องพังทั้งแถว

/* ================= 📐 ครอบตามแบบ — วาดจากระยะจริง ================= */
const isCustomShape = des => /ตามแบบ/.test(des||"");
function shapeKey(br,so,seq){ return br+"|"+so+"|"+seq; }
/* มีแบบแล้วหรือยัง — นับทั้งกรอกตัวเลขและวาดมือ
   ถ้าเช็คแค่ SHAPES[k] มีอยู่ ใบที่เคยเปิดแล้วลบทิ้งหมดจะยังขึ้นเขียวหลอกช่าง */
function shapeHas(sh){ return !!(sh && ((sh.segs&&sh.segs.length) || (sh.sketch&&sh.sketch.paths&&sh.sketch.paths.length) || (sh.note&&String(sh.note).trim()))); }
function hasShape(br,so,seq){ return shapeHas(SHAPES[shapeKey(br,so,seq)]); }
function shapeCodeOf(des){ return (String(des||"").match(/ตามแบบ\s*(\d{2,4})/)||[])[1]||null; }
/* ⚠️ รายการ "ครอบตามแบบ" ที่ยังไม่มีแบบเลย — ต้นเหตุที่งานพับหยุดกลางคัน
   ช่างเปิดใบมาเจอแต่ชื่อสินค้า ไม่มีระยะ ต้องโทรถามขาย = process กระดาษเดิมที่แอปนี้ตั้งใจฆ่า
   เตือนดัง ๆ แต่ไม่บล็อก — ขายสั่งก่อนลูกค้าส่งขนาดมาเป็นเรื่องปกติ ถ้าบล็อกจะสั่งงานไม่ได้เลย */
function shapeMissing(t){
  return tItems(t).filter(i=>i.seq && isCustomShape(i.des) && !hasShape(t.branch,t.so,i.seq));
}
/* 📚 คลังแบบ — ครอบรหัสเดียวกันซ้ำข้ามออเดอร์ (ตามแบบ 220 มาแทบทุกสัปดาห์)
   shape_drawing คีย์เป็นราย SO-รายการ ทุกใบเลยต้องวาดใหม่ตั้งแต่ศูนย์ทั้งที่เป็นครอบตัวเดิม
   อ่านจาก SHAPES ที่โหลดมาแล้วในหน่วยความจำ ไม่ยิง query เพิ่ม (ตารางเย็น cache 10 นาที — v8.3) */
function shapeLib(code, skipKey){
  if(!code) return [];
  const seen={}, out=[];
  Object.keys(SHAPES).forEach(k=>{
    if(k===skipKey) return;
    const s=SHAPES[k];
    if(!shapeHas(s) || shapeCodeOf(s.des)!==String(code)) return;
    // กันแบบซ้ำเป๊ะ ๆ โผล่เต็มแถบ — ครอบตัวเดียวกันสั่งซ้ำ 10 ใบก็ควรเห็นอันเดียว
    const sig=JSON.stringify(s.segs||[])+"|"+(((s.sketch&&s.sketch.paths)||[]).map(p=>p.d).join(""));
    if(seen[sig]) return;
    seen[sig]=1; out.push(Object.assign({_k:k}, s));
  });
  return out.sort((a,b)=>String(b.updated_at||"").localeCompare(String(a.updated_at||""))).slice(0,6);
}
function useLib(k){
  const s=SHAPES[k]; if(!s||!SHED) return;
  if(s.segs && s.segs.length){ SHED.segs=JSON.parse(JSON.stringify(s.segs)); SHED.touched=true; }
  const ps=(s.sketch&&s.sketch.paths)||[];
  if(ps.length) SK.paths=JSON.parse(JSON.stringify(ps));
  if(s.note && !String(SHED.note||"").trim()) SHED.note=s.note;   // ไม่ทับโน้ตที่คนกำลังพิมพ์อยู่
  renderShape();
}
/* แถบเตือนฝั่งขาย — ขายคือคนเดียวที่ "แก้ได้" (ได้ขนาดจากลูกค้า) ช่างแค่รอ
   เอาเฉพาะใบที่ส่งเข้าผลิตแล้วและยังไม่เสร็จ (st<4) = ใบที่กำลังจ่ออยู่หน้าเครื่องจริง ๆ */
function shapeGaps(){
  const out=[];
  tks().filter(t=>t.st<4).forEach(t=>shapeMissing(t).forEach(i=>out.push({t, i})));
  return out;
}
function gapBanner(){
  const g=shapeGaps(); if(!g.length) return "";
  return `<div class="warn" style="margin-bottom:9px">⚠️ <b>มี ${g.length} รายการ "ครอบตามแบบ" ที่สั่งผลิตไปแล้วแต่ยังไม่มีแบบ</b> — ช่างเปิดใบมาแล้วทำต่อไม่ได้ ต้องรอขายใส่ระยะ
  <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${g.map(({t,i})=>`<button class="btn amber" style="padding:4px 9px;font-size:12px" onclick="openShape('${esq(t.so)}',${i.seq},'${esq(i.des)}')">📐 ${esc(t.so)} · รายการที่ ${i.seq}</button>`).join("")}</div></div>`;
}
function shapeSVG(segs, small){
  // segs: [{L ซม., a องศาพับ (มุมที่เหล็กทำกัน เช่น 90=มุมฉาก), d 1=พับลง / -1=พับขึ้น}] — วาดจากตัวเลข = scale ตรงเสมอ
  if(!segs || !segs.length) return "";   // ใบที่ขายวาดมืออย่างเดียว ยังไม่กรอกตัวเลข — ไม่ต้องโชว์กล่องเปล่า
  const pts=[[0,0]]; let hx=1, hy=0, x=0, y=0;
  const lbl=[], angL=[];
  segs.forEach((s,i)=>{
    const L=+s.L||0, nx=x+hx*L, ny=y+hy*L;
    lbl.push({x:(x+nx)/2, y:(y+ny)/2, t:fmt(L,1), px:-hy, py:hx});
    x=nx; y=ny; pts.push([x,y]);
    if(i<segs.length-1){
      const a=+s.a||90, d=(+s.d===-1)?-1:1;
      angL.push({x, y, t:a+"°"});
      const th=(180-a)*d*Math.PI/180;
      const nhx=hx*Math.cos(th)-hy*Math.sin(th), nhy=hx*Math.sin(th)+hy*Math.cos(th);
      hx=nhx; hy=nhy;
    }
  });
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const mnx=Math.min(...xs), mxx=Math.max(...xs), mny=Math.min(...ys), mxy=Math.max(...ys);
  const pad=6, w=(mxx-mnx)+pad*2, h=(mxy-mny)+pad*2;
  let grid="";
  if(!small){
    for(let gx=Math.ceil((mnx-pad)/5)*5; gx<=mxx+pad; gx+=5) grid+=`<line x1="${gx}" y1="${(mny-pad).toFixed(1)}" x2="${gx}" y2="${(mxy+pad).toFixed(1)}" stroke="#e9edf3" stroke-width="0.25"/>`;
    for(let gy=Math.ceil((mny-pad)/5)*5; gy<=mxy+pad; gy+=5) grid+=`<line x1="${(mnx-pad).toFixed(1)}" y1="${gy}" x2="${(mxx+pad).toFixed(1)}" y2="${gy}" stroke="#e9edf3" stroke-width="0.25"/>`;
  }
  const path=pts.map((p,i)=>(i?"L ":"M ")+p[0].toFixed(2)+" "+p[1].toFixed(2)).join(" ");
  return `<svg viewBox="${(mnx-pad).toFixed(1)} ${(mny-pad).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}" style="width:100%;max-height:${small?64:300}px;background:#fff;${small?"":"border:1px solid var(--line);border-radius:10px"}">
    ${grid}
    <path d="${path}" fill="none" stroke="#1f2933" stroke-width="${small?1.4:0.8}" stroke-linejoin="miter" stroke-linecap="square"/>
    ${small?"":lbl.map(l=>`<text x="${(l.x+l.px*3.4).toFixed(1)}" y="${(l.y+l.py*3.4).toFixed(1)}" font-size="3.4" text-anchor="middle" fill="#1f5eff" font-weight="700">${l.t}</text>`).join("")}
    ${small?"":angL.map(l=>`<text x="${(l.x).toFixed(1)}" y="${(l.y-1.8).toFixed(1)}" font-size="2.7" text-anchor="middle" fill="#b54708">${l.t}</text>`).join("")}
  </svg>`;
}
/* ================= ✏️ วาดมือ/เขียนโน้ตบนแบบครอบ =================
   Gem 26 ก.ค.: ขายสเก็ตช์ตอนสั่ง ช่างเปิดดูที่เครื่องแล้วเติม/แก้ได้
   เก็บเป็น SVG path (เวกเตอร์ ไม่กี่ KB) ไม่ใช่รูปถ่าย/PNG —
   รูป raster ต่อใบจะไปกินโควตา Supabase ที่เพิ่งแก้ไปตอน v8.3 พอดี */
const r1 = n => Math.round(n*10)/10;
const skSafe = d => String(d||"").replace(/[^MLml0-9.\-\s]/g,"");   // path จาก DB = ข้อมูล ไม่ใช่โค้ด — กรองก่อนยัดลง SVG
let SK={paths:[], cur:null, w:0.9, c:"#1f2933"};
function skStart(x,y){ SK.cur={d:"M "+r1(x)+" "+r1(y), w:SK.w, c:SK.c, _p:[x,y]}; }
function skMove(x,y){
  if(!SK.cur) return;
  const [px,py]=SK.cur._p;
  if(Math.abs(x-px)+Math.abs(y-py) < 0.8) return;      // ทิ้งจุดถี่เกิน — ไฟล์เล็กลงมากโดยเส้นไม่เปลี่ยน
  SK.cur.d += " L "+r1(x)+" "+r1(y); SK.cur._p=[x,y]; skPaint();
}
function skEnd(){
  if(!SK.cur) return;
  if(SK.cur.d.indexOf("L")<0) SK.cur.d += " l 0.4 0";  // แตะจุดเดียว = จุด ไม่ใช่เส้นเปล่า
  SK.paths.push({d:SK.cur.d, w:SK.cur.w, c:SK.cur.c}); SK.cur=null; skPaint();
}
function skUndo(){ SK.paths.pop(); skPaint(); }
function skClear(){ SK.paths=[]; SK.cur=null; skPaint(); }
function skPen(c,w){ if(c) SK.c=c; if(w) SK.w=+w; renderShape(); }
function skGrid(){
  let g="";
  for(let x=0;x<=100;x+=5) g+=`<line x1="${x}" y1="0" x2="${x}" y2="70" stroke="#eef1f6" stroke-width="0.2"/>`;
  for(let y=0;y<=70;y+=5) g+=`<line x1="0" y1="${y}" x2="100" y2="${y}" stroke="#eef1f6" stroke-width="0.2"/>`;
  return g;
}
function skPathsHTML(ps){
  return (ps||[]).map(p=>`<path d="${skSafe(p.d)}" fill="none" stroke="${/^#[0-9a-f]{6}$/i.test(p.c||"")?p.c:"#1f2933"}" stroke-width="${Math.min(3,Math.max(0.3,+p.w||0.9))}" stroke-linecap="round" stroke-linejoin="round"/>`).join("");
}
function sketchSVG(sk, small){
  const ps=(sk&&sk.paths)||[];
  if(!ps.length) return "";
  return `<svg viewBox="0 0 100 70" style="width:100%;max-height:${small?90:280}px;background:#fff;border:1px solid var(--line);border-radius:10px">${skPathsHTML(ps)}</svg>`;
}
function skPaint(){
  const el=document.getElementById("sk-ink");
  if(el) el.innerHTML = skPathsHTML(SK.cur? SK.paths.concat([SK.cur]) : SK.paths);
}
function skXY(e){
  const el=document.getElementById("sk-c"); if(!el) return [0,0];
  const r=el.getBoundingClientRect();
  return [ (e.clientX-r.left)/r.width*100, (e.clientY-r.top)/r.height*70 ];
}
function skDown(e){ e.preventDefault(); const [x,y]=skXY(e); skStart(x,y); try{e.target.setPointerCapture(e.pointerId);}catch(_){} }
function skDrag(e){ if(!SK.cur) return; e.preventDefault(); const [x,y]=skXY(e); skMove(x,y); }
function skUp(){ skEnd(); }

let SHED=null;
function openShape(so, seq, des){
  const ex=SHAPES[shapeKey(branch,so,seq)];
  const hadSegs = !!(ex && ex.segs && ex.segs.length);
  SHED={so, seq:+seq, des, mode:"num", touched:hadSegs, note:(ex&&ex.note)||"",
    segs: hadSegs? JSON.parse(JSON.stringify(ex.segs)) : [{L:10,a:90,d:1},{L:10,a:90,d:-1},{L:4}]};
  SK={paths: (ex&&ex.sketch&&Array.isArray(ex.sketch.paths))? JSON.parse(JSON.stringify(ex.sketch.paths)) : [],
      cur:null, w:0.9, c:"#1f2933"};
  if(!hadSegs && SK.paths.length) SHED.mode="draw";   // ใบที่มีแต่ลายมือ → เปิดมาเจอรูปเลย
  renderShape();
  document.getElementById("shbg").classList.add("show");
}
function closeShape(){ document.getElementById("shbg").classList.remove("show"); }
document.getElementById("shbg").addEventListener("click",e=>{ if(e.target.id==="shbg") closeShape(); });
function shSeg(i,k,v){ SHED.touched=true; SHED.segs[i][k] = (k==="d")? +v : (parseFloat(v)||0); renderShape(); }
function shAdd(){ SHED.touched=true; const last=SHED.segs[SHED.segs.length-1]; if(last&&last.a===undefined){last.a=90;last.d=1;} SHED.segs.push({L:5}); renderShape(); }
function shDel(i){ SHED.touched=true; if(SHED.segs.length>2) SHED.segs.splice(i,1); renderShape(); }
function shGirth(){ return SHED.segs.reduce((s,x)=>s+(+x.L||0),0); }
function shMode(m){ SHED.mode=m; renderShape(); }
function shNote(v){ SHED.note=v; }
function libStrip(){
  const code=shapeCodeOf(SHED.des);
  const lib=shapeLib(code, shapeKey(branch,SHED.so,SHED.seq));
  if(!lib.length) return "";
  return `<div class="sec">📚 แบบ ${esc(code)} ที่เคยทำไว้ (${lib.length})</div>
  <div class="who" style="margin-bottom:5px">กดเพื่อดึงมาใช้ แล้วแก้ต่อได้ — ครอบรหัสเดียวกันจะได้ออกมาเหมือนกันทุกใบ</div>
  <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">${lib.map(s=>`
    <div style="flex:0 0 128px;border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer" onclick="useLib('${esq(s._k)}')">
      ${(s.segs&&s.segs.length)? shapeSVG(s.segs,true) : sketchSVG(s.sketch,true)}
      <div class="who" style="margin-top:4px;font-size:11px;line-height:1.35">${esc(s.sonum||"")}${s.girth_mm?` · ${fmt(s.girth_mm,0)} มม.`:""}<br>${esc(s.updated_by||"")}</div>
    </div>`).join("")}</div>`;
}
function renderShape(){
  const g=shGirth(), code=shapeCodeOf(SHED.des);
  const okc = code? Math.abs(g*10-+code)<0.5 : null;
  document.getElementById("sh-t").innerHTML = `📐 ${esc(SHED.so)} · รายการที่ ${SHED.seq}`;
  const tabs = `<div style="display:flex;gap:7px;margin-bottom:8px">
    <button class="btn ${SHED.mode==="num"?"dark":"grey"}" onclick="shMode('num')">🔢 ตัวเลข${SHED.touched?" ✓":""}</button>
    <button class="btn ${SHED.mode==="draw"?"dark":"grey"}" onclick="shMode('draw')">✏️ วาดมือ${SK.paths.length?" ✓":""}</button>
  </div>`;
  if(SHED.mode==="draw"){
    document.getElementById("sh-b").innerHTML = `
      <div class="who" style="margin-bottom:6px">${esc(SHED.des)}</div>
      ${tabs}
      ${libStrip()}
      <svg id="sk-c" viewBox="0 0 100 70" style="width:100%;max-height:300px;background:#fff;border:1px solid var(--line);border-radius:10px;touch-action:none;cursor:crosshair"
           onpointerdown="skDown(event)" onpointermove="skDrag(event)" onpointerup="skUp()" onpointerleave="skUp()" onpointercancel="skUp()">
        ${skGrid()}<g id="sk-ink">${skPathsHTML(SK.paths)}</g>
      </svg>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        ${[["#1f2933","ดำ"],["#1f5eff","น้ำเงิน"],["#d92d20","แดง"]].map(([c,n])=>`<button class="btn ${SK.c===c?"dark":"grey"}" style="padding:6px 10px" onclick="skPen('${c}')"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c};vertical-align:middle"></span> ${n}</button>`).join("")}
        <button class="btn ${SK.w<0.9?"dark":"grey"}" style="padding:6px 10px" onclick="skPen('',0.5)">บาง</button>
        <button class="btn ${SK.w>1.2?"dark":"grey"}" style="padding:6px 10px" onclick="skPen('',1.6)">หนา</button>
        <button class="btn grey" style="padding:6px 10px" onclick="skUndo()">↩ ย้อน</button>
        <button class="btn grey" style="padding:6px 10px" onclick="skClear()">🗑 ล้าง</button>
      </div>
      <div class="sec">📝 โน้ตถึงช่าง</div>
      <textarea id="sk-note" rows="2" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:14px;font-family:inherit" placeholder="เช่น ด้านที่ 2 พับกลับ 5 มม. กันคม / ลูกค้าขอปลายเรียบ" oninput="shNote(this.value)">${esc(SHED.note||"")}</textarea>
      <div style="margin-top:9px;display:flex;gap:7px;flex-wrap:wrap">
        <button class="btn blue" onclick="shSave()">💾 บันทึกแบบ (ช่างเครื่องพับเห็นทันที)</button>
      </div>
      <div class="who" style="margin-top:7px">ลากนิ้ว/เมาส์บนกระดาษตารางเพื่อวาด · ตารางไว้กะสัดส่วนเฉย ๆ ไม่ใช่มาตราส่วนจริง — ระยะจริงกรอกที่แท็บ 🔢 ตัวเลข ซึ่งวาดรูป scale ตรงให้เอง<br>ช่างเปิดแบบนี้ที่เครื่องแล้วเติมได้ ระบบจดว่าใครแก้ล่าสุด</div>`;
    return;
  }
  document.getElementById("sh-b").innerHTML = `
    <div class="who" style="margin-bottom:6px">${esc(SHED.des)}</div>
    ${tabs}
    ${libStrip()}
    ${shapeSVG(SHED.segs)}
    <div class="who" style="margin:7px 0">หน้ากว้างรวม <b>${fmt(g,1)} ซม. = ${fmt(g*10,0)} มม.</b>
      ${code? (okc? `<span class="okpill">✓ ตรงรหัสแบบ ${code}</span>` : `<span class="bdg late">⚠ รหัสสินค้าระบุแบบ ${code} — ผลรวมด้านยังไม่ตรง</span>`) : ""}
      · ตารางพื้นหลัง = 5 ซม.</div>
    <table class="items">${SHED.segs.map((s,i)=>`<tr>
      <td style="white-space:nowrap">ด้านที่ ${i+1}</td>
      <td><input type="number" step="0.5" min="0" value="${s.L}" style="width:74px;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:14px" onchange="shSeg(${i},'L',this.value)"> ซม.</td>
      <td style="white-space:nowrap">${i<SHED.segs.length-1? `พับ
        <select style="border:1px solid var(--line);border-radius:8px;padding:7px" onchange="shSeg(${i},'d',this.value)"><option value="1" ${+s.d!==-1?"selected":""}>↓ ลง</option><option value="-1" ${+s.d===-1?"selected":""}>↑ ขึ้น</option></select>
        <input type="number" step="5" min="10" max="175" value="${s.a||90}" style="width:60px;border:1px solid var(--line);border-radius:8px;padding:7px" onchange="shSeg(${i},'a',this.value)">°` : `<span class="who">ปลายเหล็ก</span>`}</td>
      <td><button class="btn grey" style="padding:5px 9px" onclick="shDel(${i})">✕</button></td>
    </tr>`).join("")}</table>
    <div style="margin-top:9px;display:flex;gap:7px;flex-wrap:wrap">
      <button class="btn grey" onclick="shAdd()">➕ เพิ่มด้าน</button>
      <button class="btn blue" onclick="shSave()">💾 บันทึกแบบ (ช่างเครื่องพับเห็นทันที)</button>
    </div>
    <div class="who" style="margin-top:7px">กรอกระยะเป็น ซม. ตามที่เขียนหน้าบิล · องศา 90 = มุมฉาก (มากกว่า 90 = พับป้าน/ลาดเอียง) · ↓↑ = พับลงหรือขึ้นเทียบด้านก่อนหน้า · รูปวาดจากตัวเลขล้วน — scale ตรงเสมอ ไม่เพี้ยนตามภาพถ่าย</div>`;
}
async function shSave(){
  if(BUSY||!SHED) return;
  BUSY=true; document.body.classList.add("busy");
  try{
    /* ถ้าขายวาดมืออย่างเดียวไม่ได้แตะตัวเลข → อย่าบันทึกด้านตั้งต้นเป็นของจริง
       เพราะ girth ปลอมจะไปเช็คกับรหัสแบบแล้วขึ้นถูก/ผิดมั่ว ๆ */
    const segs = SHED.touched? SHED.segs : [];
    const row={branch, sonum:SHED.so, seq:SHED.seq, des:SHED.des, segs,
      sketch:{paths:SK.paths}, note:SHED.note||"",
      girth_mm: segs.length? Math.round(shGirth()*10) : null, updated_by:USER.name, updated_at:new Date().toISOString()};
    await DB.upsertShape(row);
    SHAPES[shapeKey(branch,SHED.so,SHED.seq)]=row;
    closeShape(); render();
  }catch(e){ console.error(e); alertBar("บันทึกแบบไม่สำเร็จ — เช็คเน็ต"); }
  BUSY=false; document.body.classList.remove("busy");
}

/* ================= modal ================= */
async function openM(id){

/* ================= shell ================= */
function renderSyncs(){
  document.getElementById("syncs").innerHTML = ["SKN","BK","PPS"].map(b=>{
    if(!SYNCMAX[b]) return `<span class="bad">⚪ ${b} ยังไม่มีข้อมูล</span>`;
    const t=new Date(SYNCMAX[b]);
    const stale=(Date.now()-t.getTime())>10*60*1000;
    return `<span class="${stale?'bad':''}">${stale?'🔴':'🟢'} ${b} ${t.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})}</span>`;
  }).join("");
}
function render(){
  if(!USER||!loaded) return;
  document.getElementById("tabs").innerHTML = ["SKN","BK","PPS"].map(b=>
    `<button class="tab ${b===branch?"on":""}" onclick="branch='${b}';render()">${b}</button>`).join("");
  const nPlan=tks().filter(t=>t.st===1).length + tks().filter(t=>t.st===0&&t.xborder).length;
  const ONLINE_BR = ["SKN","BK"];   // สาขาที่ผลิต+ส่งงานออนไลน์ตอนนี้
  if(view==="online" && (!ONLINE_BR.includes(branch)||PPO_MODE)) view="order";
  const nJob=JOBS.filter(j=>j.branch===branch&&j.status==="new").length
    + CARDS[branch].filter(c=>cardOnline(c)&&!c.x&&(c.date||"")>=cutView3()&&!TK.some(t=>t.branch===branch&&t.so===c.so&&alive(t))).length;
  const V=[["order","🛒 ฝั่งขาย: สั่งผลิต",0],
    ...(ONLINE_BR.includes(branch)&&!PPO_MODE?[["online","🛍 ออนไลน์",nJob]]:[]),
    ["plan","📋 ฝั่งผลิต: วางแผน",nPlan],["board","🎛️ บอร์ดเครื่อง",0],["pack","📦 รวมของ/ส่ง",0],["flight","🛫 สถานะวันนี้",0],
    ["stock","🏭 ผลิตเข้าสต็อค",tks().filter(t=>t.stock&&t.st===4).length],["report","📊 เวลา",0]];
  document.getElementById("vtabs").innerHTML = V.map(([v,l,n])=>
    `<button class="vtab ${v===view?"on":""}" onclick="view='${v}';render()">${l}${n?`<span class="b">${n}</span>`:""}</button>`).join("")
    + (view==="board"||view==="flight" ? `<button class="vtab ${TVMODE?"on":""}" title="โหมดจอ TV — ตัวใหญ่ อ่านได้ข้ามโรงงาน" onclick="TVMODE=!TVMODE;render()">📺 จอ TV</button>` : "");
  const tvOn = TVMODE && (view==="board"||view==="flight");
  document.body.classList.toggle("dk", tvOn);   // 🌑 Mission Control เฉพาะตอนตั้งใจกด 📺 จอ TV — ใช้งานปกติพื้นหลังสีเดียวทั้งแอป (Gem เคาะ 2 ส.ค.)
  document.body.classList.toggle("tv", tvOn);   // 📺 ตัวใหญ่ อ่านไกล
  /* 🎬 FLIP: จำตำแหน่งการ์ดบนบอร์ดก่อนวาดใหม่ → การ์ดที่ย้ายคอลัมน์ "ลื่น" ไปที่ใหม่ ไม่วาร์ป */
  const sameBoard = view==="board" && window.__lastView===view+"|"+branch;
  let flipPrev=null;
  if(sameBoard){
    flipPrev={};
    document.querySelectorAll('#main .bcard[id^="tk-"]').forEach(n=>{ const r=n.getBoundingClientRect(); flipPrev[n.id]=[r.left,r.top]; });
  }
  ({order:vOrder, online:vOnline, plan:vPlan, board:vBoard, pack:vPack, stock:vStock, report:vReport, flight:vFlight})[view]();
  if(flipPrev){
    document.querySelectorAll('#main .bcard[id^="tk-"]').forEach(n=>{
      const p=flipPrev[n.id]; if(!p) return;
      const r=n.getBoundingClientRect(), dx=p[0]-r.left, dy=p[1]-r.top;
      if(Math.abs(dx)+Math.abs(dy)<4) return;
      n.style.transition="none"; n.style.transform=`translate(${dx}px,${dy}px)`;
      requestAnimationFrame(()=>{ n.style.transition="transform .35s cubic-bezier(.2,.8,.2,1)"; n.style.transform="";
        setTimeout(()=>{ n.style.transition=""; }, 420); });
    });
  }
  const mainEl=document.getElementById("main");
  if(window.__lastView !== view+"|"+branch){
    mainEl.classList.add("vin");                       // 🎬 การ์ดสไลด์เข้าเวลาเปลี่ยนหน้า (ครั้งเดียว)
    setTimeout(()=>mainEl.classList.remove("vin"), 450);
    if(view==="flight") mainEl.querySelectorAll(".cnt-up").forEach(countUp);   // 🔢 นับขึ้นเฉพาะตอนเพิ่งเข้าจอ
  }
  window.__lastView = view+"|"+branch;
  renderSyncs();
}

let lgBranch="SKN", lgStaff=null, lgPin="";
function renderLogin(){

    : '<div style="grid-column:1/-1;color:var(--muted);font-size:12px">ไม่มีรายชื่อ — เพิ่มในตาราง staff</div>';

  document.getElementById("pinpad").innerHTML = ["1","2","3","4","5","6","7","8","9","⌫","0","✓"].map(k=>
    `<button onclick="lgKey('${k}')">${k}</button>`).join("");

function lgMode(m){
  document.getElementById("lg-email-pane").style.display = m==="email"?"":"none";
  document.getElementById("lg-pin-pane").style.display = m==="pin"?"":"none";
  document.getElementById("lg-err").textContent="";
  if(m==="pin") renderLogin();
}
let otpPoll=null;
async function sendOtp(){
  const err=document.getElementById("lg-err");
  const em=(document.getElementById("lg-email").value||"").trim().toLowerCase();
  if(!em||!em.includes("@")){ err.textContent="กรอกอีเมลก่อนครับ"; return; }
  const s=STAFF.find(s=>s.email&&s.email.toLowerCase()===em);
  if(!s){ err.textContent="อีเมลนี้ยังไม่ได้รับสิทธิ์ — แจ้งแอดมินเพิ่มในระบบก่อน"; return; }
  const btn=document.getElementById("lg-send");
  btn.disabled=true; btn.textContent="กำลังส่ง…";
  try{ await DB.sendOtp(em); }
  catch(e){ btn.disabled=false; btn.textContent="ส่งลิงก์อีกครั้ง"; err.textContent="ส่งไม่สำเร็จ: "+(e.message||e); return; }
  btn.disabled=false; btn.textContent="ส่งลิงก์อีกครั้ง";
  err.textContent=""; document.getElementById("lg-wait").style.display="block";
  clearInterval(otpPoll);
  otpPoll=setInterval(async ()=>{
    const se=await DB.getSessionEmail();
    if(se){ clearInterval(otpPoll); enterByEmail(se); }
  }, 2500);
}
function enterByEmail(em){
  const s=STAFF.find(s=>s.email&&s.email.toLowerCase()===em);
  if(!s){ document.getElementById("lg-err").textContent="อีเมลนี้ยังไม่ได้รับสิทธิ์"; DB.signOut(); return; }
  enterAsStaff(s, "email");
}
function enterAsStaff(s, mode){
  USER={dbid:s.id, name:s.name, role:s.role, branch:s.branch, mode,
    canFix: s.role==="planner"||s.role==="admin",
    /* 🏭 ออกใบผลิตเข้าสต็อคได้: หัวหน้าผลิต + ผจก.สาขา + ทีมขาย (Gem เคาะ — ขายเห็นของหมดหน้าร้านก่อนใคร) */
    canStock: s.role==="planner"||s.role==="admin"||s.role==="sales"};
  document.getElementById("loginbg").style.display="none";
  const uc=document.getElementById("userchip");
  uc.style.display=""; uc.innerHTML=`👤 ${esc(USER.name)} <button onclick="logout()" title="ออกจากระบบ">✕</button>`;
  if(USER.branch!=="ALL") branch=USER.branch;
  view = ({sales:"order", planner:"plan", operator:"board", packer:"pack"})[USER.role]||"order";
  try{ localStorage.setItem("prod007_pin_user", mode==="pin"? JSON.stringify({id:s.id}) : ""); }catch(e){}
  render();
}
function lgSetBranch(b){ lgBranch=b; lgStaff=null; lgPin=""; renderLogin(); }
function lgSetStaff(id){ lgStaff=id; lgPin=""; document.getElementById("lg-err").textContent=""; renderLogin(); }
async function lgKey(k){
  const err=document.getElementById("lg-err");
  if(k==="⌫"){ lgPin=lgPin.slice(0,-1); renderLogin(); return; }
  if(k==="✓"){ return lgTry(); }
  if(!lgStaff){ err.textContent="เลือกชื่อก่อนครับ"; return; }
  if(lgPin.length>=4) return;
  lgPin+=k; renderLogin();
  if(lgPin.length===4) lgTry();
}
async function lgTry(){
  const err=document.getElementById("lg-err");
  const s=STAFF.find(x=>x.id===lgStaff);
  if(!s||lgPin.length<4) return;
  const ok=await DB.verifyPin(s.id,lgPin);
  if(!ok){ err.textContent="PIN ไม่ถูกต้อง"; lgPin=""; renderLogin(); return; }
  enterAsStaff(s, "pin");
}
async function logout(){
  try{ localStorage.removeItem("prod007_pin_user"); }catch(e){}
  await DB.signOut(); location.reload();
}

    STAFF = await DB.getStaff();
    await reload();
    /* 🔋 แอปที่ถูกพับไว้ (วางมือถือ / สลับแท็บ) ไม่ต้องโหลดอะไรทั้งนั้น — กลับมาดูค่อยดึงรวดเดียว
       ทีม 21 คนเปิดทิ้งไว้ทั้งวัน ข้อนี้อย่างเดียวตัดทราฟฟิกไปเกินครึ่ง */
    const tick=(force)=>{ if(document.hidden) return; reload(force).then(ch=>{ if(ch) render(); }); };
    DB.onChange(()=>{ if(document.hidden) return; clearTimeout(rtTimer); rtTimer=setTimeout(()=>tick(),700); });
    setInterval(()=>tick(), 180000);
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) tick(true); });
    cn.textContent="LIVE"; cn.className="conn live";
  }catch(e){
    console.error(e);
    cn.textContent="ต่อระบบไม่ได้"; cn.className="conn off";
    document.getElementById("lg-err").textContent="ต่อฐานข้อมูลไม่ได้ — เช็คอินเทอร์เน็ตแล้วรีเฟรช";
    return;
  }
  // คืน session: email (supabase เก็บเอง) หรือ PIN (จอไลน์)
  const se=await DB.getSessionEmail();
  if(se){ enterByEmail(se); return; }
  try{
    const pu=JSON.parse(localStorage.getItem("prod007_pin_user")||"null");
    if(pu&&pu.id){ const s=STAFF.find(x=>x.id===pu.id); if(s){ enterAsStaff(s,"pin"); return; } }
  }catch(e){}
  lgMode("email"); renderLogin();
}
boot();
</script>
</body>
</html>
